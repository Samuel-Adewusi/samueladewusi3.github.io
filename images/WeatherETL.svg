<svg viewBox="0 0 1200 826" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="826" fill="#1b1f24"/>

  <!-- Title -->
  <text x="60" y="90" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">ETL Weather Pipeline</text>
  <text x="60" y="130" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9aa5b1">Open-Meteo API  →  Python (extract / transform)  →  PostgreSQL</text>

  <!-- Stage boxes -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Box 1: API -->
    <rect x="60" y="220" width="240" height="130" rx="10" fill="#2b3138" stroke="#4f5b66" stroke-width="2"/>
    <text x="180" y="275" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Open-Meteo API</text>
    <text x="180" y="305" font-size="15" fill="#9aa5b1" text-anchor="middle">Hourly forecast JSON</text>
    <text x="180" y="326" font-size="15" fill="#9aa5b1" text-anchor="middle">extract.py</text>

    <!-- Arrow 1 -->
    <line x1="300" y1="285" x2="380" y2="285" stroke="#5fb0d8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Box 2: Raw JSON -->
    <rect x="390" y="220" width="240" height="130" rx="10" fill="#2b3138" stroke="#4f5b66" stroke-width="2"/>
    <text x="510" y="275" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Raw JSON</text>
    <text x="510" y="305" font-size="15" fill="#9aa5b1" text-anchor="middle">Timestamped payloads</text>
    <text x="510" y="326" font-size="15" fill="#9aa5b1" text-anchor="middle">data/raw/</text>

    <!-- Arrow 2 -->
    <line x1="630" y1="285" x2="710" y2="285" stroke="#5fb0d8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Box 3: Transform -->
    <rect x="720" y="220" width="240" height="130" rx="10" fill="#2b3138" stroke="#4f5b66" stroke-width="2"/>
    <text x="840" y="265" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">Cleaned</text>
    <text x="840" y="292" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">DataFrame</text>
    <text x="840" y="320" font-size="15" fill="#9aa5b1" text-anchor="middle">transform.py — dedupe,</text>
    <text x="840" y="340" font-size="15" fill="#9aa5b1" text-anchor="middle">type-cast, null handling</text>

    <!-- Arrow down -->
    <line x1="840" y1="350" x2="840" y2="430" stroke="#5fb0d8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Box 4: Postgres -->
    <rect x="700" y="440" width="280" height="130" rx="10" fill="#2b3138" stroke="#5fb0d8" stroke-width="2"/>
    <text x="840" y="490" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="bold">PostgreSQL</text>
    <text x="840" y="518" font-size="15" fill="#9aa5b1" text-anchor="middle">weather_observations</text>
    <text x="840" y="540" font-size="15" fill="#9aa5b1" text-anchor="middle">UPSERT on (city, observed_at)</text>
  </g>

  <!-- Footer badges -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1b1f24" font-weight="bold">
    <rect x="60" y="620" width="120" height="36" rx="18" fill="#5fb0d8"/>
    <text x="120" y="644" text-anchor="middle">Python 3.11</text>

    <rect x="195" y="620" width="120" height="36" rx="18" fill="#5fb0d8"/>
    <text x="255" y="644" text-anchor="middle">PostgreSQL</text>

    <rect x="330" y="620" width="110" height="36" rx="18" fill="#5fb0d8"/>
    <text x="385" y="644" text-anchor="middle">Docker</text>

    <rect x="455" y="620" width="110" height="36" rx="18" fill="#5fb0d8"/>
    <text x="510" y="644" text-anchor="middle">pytest</text>

    <rect x="580" y="620" width="170" height="36" rx="18" fill="#5fb0d8"/>
    <text x="665" y="644" text-anchor="middle">GitHub Actions CI</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5fb0d8"/>
    </marker>
  </defs>
</svg>
